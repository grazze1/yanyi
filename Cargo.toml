[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/context-engine",
  "crates/database",
  "crates/deepseek-client",
  "crates/glossary-engine",
  "crates/memory-engine",
  "crates/native-host",
  "crates/translator-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
url = "2.5.8"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
